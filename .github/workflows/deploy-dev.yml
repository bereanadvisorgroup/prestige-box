name: CI/CD Development Environment

on:
  push:
    branches:
      - dev

# Force GitHub to explicitly grant deployment and secret access
permissions:
  deployments: write
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    environment: dev # Explicitly add the environment scope here too
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk Open Source Vulnerability Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  vercel-deployment:
    runs-on: ubuntu-latest
    needs: secret-scan # Ensure the security scan passes first
    environment: dev
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install -g vercel

      # DIAGNOSTIC CHECK: This safely prints character lengths to verify secrets exist
      - name: Verify Secret Availability
        run: |
          echo "Checking token length: ${#VERCEL_TOKEN}"
          echo "Checking Org ID length: ${#VERCEL_ORG_ID}"
          echo "Checking Project ID length: ${#VERCEL_PROJECT_ID}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=development --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
