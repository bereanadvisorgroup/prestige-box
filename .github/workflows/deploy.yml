name: CI/CD Multi-Environment Pipeline

on:
    push:
        branches:
            - dev
            - test
            - main

jobs:
    # ==========================================
    # DEV ENVIRONMENT
    # ==========================================
    snyk-scan-dev:
        if: github.ref == 'refs/heads/dev'
        runs-on: ubuntu-latest
        environment: Dev

        steps:
            - name: Checkout Codebase
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Snyk Open Source Vulnerability Scan
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --all-projects --severity-threshold=high

    deploy-dev:
        if: github.ref == 'refs/heads/dev'
        needs: snyk-scan-dev
        runs-on: ubuntu-latest
        environment: Dev

        steps:
            - name: Checkout Codebase
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Dev Migrations & Seed Fake Data
              env:
                  DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
                  NODE_OPTIONS: "--dns-result-order=ipv4first"
              run: |
                  pnpm dlx tsx src/db/migrate.ts
                  pnpm dlx tsx src/db/seed.ts

            - name: Install Vercel CLI
              run: npm install -g vercel

            - name: Pull & Deploy to Dev Project
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  vercel pull --yes --environment=production --token=$VERCEL_TOKEN
                  vercel build --prod --token=$VERCEL_TOKEN
                  vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

    # ==========================================
    # TEST ENVIRONMENT
    # ==========================================
    deploy-test:
        if: github.ref == 'refs/heads/test'
        runs-on: ubuntu-latest
        environment: Test

        steps:
            - name: Checkout Codebase
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install PostgreSQL Tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client

            - name: Clone Prod Data into Test Database
              env:
                  PROD_DB: ${{ secrets.SUPABASE_DIRECT_URL_PROD }}
                  TEST_DB: ${{ secrets.SUPABASE_DIRECT_URL }}
              run: |
                  echo "Cloning Prod DB data to Test DB..."
                  pg_dump "$PROD_DB" --clean --no-owner --no-acl | psql "$TEST_DB"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Migrations on Test DB
              env:
                  DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
                  NODE_OPTIONS: "--dns-result-order=ipv4first"
              run: pnpm dlx tsx src/db/migrate.ts

            - name: Install Vercel CLI
              run: npm install -g vercel

            - name: Pull & Deploy to Test Project
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  vercel pull --yes --environment=production --token=$VERCEL_TOKEN
                  vercel build --prod --token=$VERCEL_TOKEN
                  vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

    # ==========================================
    # PRODUCTION ENVIRONMENT
    # ==========================================
    deploy-prod:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: Production

        steps:
            - name: Checkout Codebase
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Production Migrations
              env:
                  DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
                  NODE_OPTIONS: "--dns-result-order=ipv4first"
              run: pnpm dlx tsx src/db/migrate.ts

            - name: Install Vercel CLI
              run: npm install -g vercel

            - name: Pull & Deploy to Production Project
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  vercel pull --yes --environment=production --token=$VERCEL_TOKEN
                  vercel build --prod --token=$VERCEL_TOKEN
                  vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
