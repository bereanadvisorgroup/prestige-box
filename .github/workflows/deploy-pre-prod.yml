name: CI/CD Pre-Production Environment

on:
  push:
    branches:
      - pre-prod

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  database-migration:
    runs-on: ubuntu-latest
    environment: Pre-Prod
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle Pre-Prod Migrations
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL_PRE_PROD }}
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: pnpm dlx tsx src/db/migrate.ts

  vercel-deployment:
    needs: database-migration
    runs-on: ubuntu-latest
    environment: Pre-Prod
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Verify Vercel Secrets
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ]; then echo "❌ Secret VERCEL_ORG_ID is missing or empty!"; exit 1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "❌ Secret VERCEL_PROJECT_ID is missing or empty!"; exit 1; fi
          echo "✅ Vercel Org ID and Project ID secrets are present."

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=pre-prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
